# Reusable release: a GitHub Release for a version tag, with that version's CHANGELOG section as
# its notes. A tag without a CHANGELOG section is refused, so every release says what changed.
#
# Called on a tag push; the caller grants `contents: write` (this workflow asks for nothing
# itself, so a dry run inherits a read-only token):
#
#   on:
#     push:
#       tags: ["v*.*.*"]
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: Zokuaku/shared-workflows/.github/workflows/release.yml@v0.2.0
#       with:
#         tag: ${{ github.ref_name }}
name: release

on:
  workflow_call:
    inputs:
      tag:
        description: The version tag, vMAJOR.MINOR.PATCH.
        type: string
        required: true
      changelog:
        description: The changelog, relative to the repository root. Sections are '## <tag> ...'.
        type: string
        default: "CHANGELOG.md"
      dry_run:
        description: Build the notes and stop - no release is created.
        type: boolean
        default: false
      expect_failure:
        description: For this repository's self-test only - building the notes must FAIL.
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: release notes from the changelog
        id: notes
        continue-on-error: ${{ inputs.expect_failure }}
        env:
          TAG: ${{ inputs.tag }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${TAG}' is not a version tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          awk -v heading="## ${TAG}" '
            index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "${CHANGELOG}" > "${RUNNER_TEMP}/notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md"; then
            echo "::error::${CHANGELOG} has no section for ${TAG}"
            exit 1
          fi
          cat "${RUNNER_TEMP}/notes.md"
      - name: the planted defect was caught
        if: ${{ inputs.expect_failure }}
        run: test "${{ steps.notes.outcome }}" = failure
      - name: create the release
        if: ${{ !inputs.dry_run && !inputs.expect_failure }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
