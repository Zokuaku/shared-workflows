# This repository tests its own workflows: a clean module must pass every check, and a module
# with one planted defect per check must make exactly that check fail. The release workflow is
# tested the same way, as a dry run.
name: self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean-module:
    uses: ./.github/workflows/terraform-module.yml
    with:
      working_directory: tests/fixtures/clean

  planted-fmt:
    uses: ./.github/workflows/terraform-module.yml
    with:
      working_directory: tests/fixtures/planted-fmt
      checks: fmt
      expect_failure: true

  planted-validate:
    uses: ./.github/workflows/terraform-module.yml
    with:
      working_directory: tests/fixtures/planted-validate
      checks: validate
      expect_failure: true

  planted-tflint:
    uses: ./.github/workflows/terraform-module.yml
    with:
      working_directory: tests/fixtures/planted-tflint
      checks: tflint
      expect_failure: true

  planted-test:
    uses: ./.github/workflows/terraform-module.yml
    with:
      working_directory: tests/fixtures/planted-test
      checks: test
      expect_failure: true

  planted-scan:
    uses: ./.github/workflows/terraform-module.yml
    with:
      working_directory: tests/fixtures/planted-scan
      checks: scan
      expect_failure: true

  # The release workflow, without releasing anything: notes are built for a version the
  # fixture changelog has, and refused for one it does not.
  release-notes:
    uses: ./.github/workflows/release.yml
    with:
      tag: v9.9.9
      changelog: tests/fixtures/release/CHANGELOG.md
      dry_run: true

  planted-release-notes:
    uses: ./.github/workflows/release.yml
    with:
      tag: v9.9.8
      changelog: tests/fixtures/release/CHANGELOG.md
      dry_run: true
      expect_failure: true
