# Reusable checks for a Terraform module repository: format, validate, lint, test.
#
# Called from the module repository's own workflow:
#
#   jobs:
#     checks:
#       uses: Zokuaku/shared-workflows/.github/workflows/terraform-module.yml@v0.1.0
#
# Every third-party action is pinned to a full commit id (a tag can be moved; a commit cannot),
# with the release it came from in a comment. Each check is its own job, so each shows up as
# its own status check and can be made required on its own.
name: terraform-module

on:
  workflow_call:
    inputs:
      working_directory:
        description: The module root, relative to the repository root.
        type: string
        default: "."
      terraform_version:
        description: Terraform CLI version, exact.
        type: string
        default: "1.16.6"
      tflint_version:
        description: TFLint version, exact.
        type: string
        default: "v0.64.0"
      checks:
        description: Which checks to run, space-separated. Any of fmt validate tflint test.
        type: string
        default: "fmt validate tflint test"
      expect_failure:
        description: >-
          For this repository's self-test only. The selected checks must FAIL, because the
          module under test carries a planted defect. A check that cannot catch its own
          planted defect is not a check.
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    if: contains(format(' {0} ', inputs.checks), ' fmt ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
      - name: terraform fmt -check
        run: ${{ inputs.expect_failure && '!' || '' }} terraform fmt -check -recursive -diff

  validate:
    name: validate
    if: contains(format(' {0} ', inputs.checks), ' validate ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: ${{ inputs.expect_failure && '!' || '' }} terraform validate
      - name: validate every example
        if: ${{ !inputs.expect_failure }}
        run: |
          shopt -s nullglob
          for example in examples/*/; do
            echo "::group::${example}"
            (cd "${example}" && terraform init -backend=false -input=false && terraform validate)
            echo "::endgroup::"
          done

  tflint:
    name: tflint
    if: contains(format(' {0} ', inputs.checks), ' tflint ')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint_version }}
      - name: tflint --init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}   # plugin downloads, without the anonymous rate limit
      - name: tflint
        run: ${{ inputs.expect_failure && '!' || '' }} tflint --format compact

  test:
    name: test
    if: contains(format(' {0} ', inputs.checks), ' test ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform test
        run: ${{ inputs.expect_failure && '!' || '' }} terraform test
